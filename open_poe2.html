<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE2 다음 사이트 열기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .open-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .open-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .open-button:active {
            transform: translateY(-1px);
        }

        .url-display {
            margin-top: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            color: #666;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .status {
            margin-top: 20px;
            height: 30px;
            color: #28a745;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status.show {
            opacity: 1;
        }

        .info {
            margin-top: 25px;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Path of Exile 2</h1>
        <p class="subtitle">다음 게임 사이트</p>

        <button class="open-button" onclick="openInEdge()">
            Edge로 열기 🚀
        </button>

        <div class="url-display">
            https://pathofexile2.game.daum.net/main
        </div>

        <div class="status" id="status"></div>

        <div class="info">
            💡 클릭하면 Microsoft Edge 브라우저로 사이트가 열립니다<br>
            Edge가 기본 브라우저가 아니어도 작동합니다
        </div>
    </div>

    <script>
        const POE2_URL = 'https://pathofexile2.game.daum.net/main';

        function openInEdge() {
            const status = document.getElementById('status');

            // Try to open with Edge protocol on Windows
            const isWindows = navigator.userAgent.indexOf('Windows') !== -1;

            if (isWindows) {
                // Windows에서 Edge로 직접 열기 시도
                const edgeUrl = 'microsoft-edge:' + POE2_URL;
                window.location.href = edgeUrl;

                status.textContent = '✓ Edge로 열기 시도 중...';
                status.classList.add('show');

                // Fallback: 일반 방식으로도 열기
                setTimeout(() => {
                    window.open(POE2_URL, '_blank');
                }, 500);
            } else {
                // 다른 OS에서는 일반적으로 열기
                window.open(POE2_URL, '_blank');
                status.textContent = '✓ 새 창에서 열었습니다!';
                status.classList.add('show');
            }

            setTimeout(() => {
                status.classList.remove('show');
            }, 3000);
        }

        // 키보드 단축키: Enter 또는 Space로도 실행 가능
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openInEdge();
            }
        });
    </script>
</body>
</html>
